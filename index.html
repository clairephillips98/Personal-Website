<!DOCTYPE html>
<html lang="en" data-theme="day">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claire Phillips</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="scene">

  <!-- ── Central photo ─────────────────────────────────────────── -->
  <div class="photo-wrap">
    <!--
      To use a real photo, replace the div below with:
      <img src="your-photo.jpg" alt="Claire Phillips" class="photo-img" />
    -->
    <div class="photo-placeholder">
      <svg class="silhouette" viewBox="0 0 120 150" xmlns="http://www.w3.org/2000/svg">
        <circle cx="60" cy="42" r="26" fill="currentColor"/>
        <path d="M6 150 Q6 94 60 94 Q114 94 114 150 Z" fill="currentColor"/>
      </svg>
    </div>
  </div>

  <!-- ── Scattered items ────────────────────────────────────────── -->
  <div class="items-layer">

    <!-- Graduation Cap → Education -->
    <button class="item" data-popup="education" style="top:9%;left:10%;--r:-8deg">
      <span class="item-icon">🎓</span>
      <span class="item-label">Education</span>
    </button>

    <!-- Hardware Chip → Tech Skills -->
    <button class="item" data-popup="tech" style="top:7%;left:67%;--r:6deg">
      <span class="item-icon chip-icon">
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <!-- body -->
          <rect x="17" y="17" width="30" height="30" rx="3" fill="currentColor"/>
          <!-- top pins -->
          <rect x="23" y="7"  width="5" height="10" rx="2" fill="currentColor"/>
          <rect x="36" y="7"  width="5" height="10" rx="2" fill="currentColor"/>
          <!-- bottom pins -->
          <rect x="23" y="47" width="5" height="10" rx="2" fill="currentColor"/>
          <rect x="36" y="47" width="5" height="10" rx="2" fill="currentColor"/>
          <!-- left pins -->
          <rect x="7"  y="23" width="10" height="5" rx="2" fill="currentColor"/>
          <rect x="7"  y="36" width="10" height="5" rx="2" fill="currentColor"/>
          <!-- right pins -->
          <rect x="47" y="23" width="10" height="5" rx="2" fill="currentColor"/>
          <rect x="47" y="36" width="10" height="5" rx="2" fill="currentColor"/>
          <!-- inner recess -->
          <rect x="25" y="25" width="14" height="14" rx="2" fill="none" stroke-width="2.5" style="stroke:var(--card-bg)"/>
          <circle cx="32" cy="32" r="2.5" style="fill:var(--card-bg)"/>
        </svg>
      </span>
      <span class="item-label">Tech</span>
    </button>

    <!-- Running Shoe → Athlete -->
    <button class="item" data-popup="sport" style="top:73%;left:7%;--r:12deg">
      <span class="item-icon">👟</span>
      <span class="item-label">Athlete</span>
    </button>

    <!-- Earth → ESG -->
    <button class="item" data-popup="esg" style="top:72%;left:73%;--r:-5deg">
      <span class="item-icon">🌍</span>
      <span class="item-label">ESG</span>
    </button>

    <!-- Bar Chart → Analytics -->
    <button class="item" data-popup="data" style="top:38%;left:83%;--r:3deg">
      <span class="item-icon">📊</span>
      <span class="item-label">Analytics</span>
    </button>

    <!-- Trophy → AI & Awards -->
    <button class="item" data-popup="ai" style="top:5%;left:39%;--r:-4deg">
      <span class="item-icon">🏆</span>
      <span class="item-label">AI&nbsp;&amp;&nbsp;Awards</span>
    </button>

    <!-- Satellite Dish → Research -->
    <button class="item" data-popup="research" style="top:44%;left:3%;--r:9deg">
      <span class="item-icon">📡</span>
      <span class="item-label">Research</span>
    </button>

  </div><!-- /.items-layer -->

</div><!-- /.scene -->

<!-- ── Modal popup ──────────────────────────────────────────────── -->
<div class="overlay" id="overlay" role="dialog" aria-modal="true">
  <div class="modal" id="modal">
    <button class="modal-close" id="modal-close" aria-label="Close">&#x2715;</button>
    <div class="modal-icon" id="modal-icon" aria-hidden="true"></div>
    <h2 class="modal-title" id="modal-title"></h2>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
